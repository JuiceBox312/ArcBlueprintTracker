<!DOCTYPE html>
<html lang="en">

<title>ArcBlueprintTracker</title>
<link rel="stylesheet" href="style.css">

<body>

<header>
  <h1>ArcBlueprintTracker</h1>
  <nav>

    <a href="locations.html">Locations</a>
  </nav>
</header>

<main>
  <h2>Blueprint Tracker</h2>

<div class="controls">
  <input id="search" placeholder="Search blueprints...">
  <select id="mapFilter"><option value="">All Maps</option></select>
  <select id="typeFilter"><option value="">All Types</option></select>
  <select id="rarityFilter"><option value="">All Rarity</option></select>

  <button id="selectAll">Select All</button>

  <p id="progress"></p>
  <div id="trackerGrid" class="grid"></div>

<script src="app.js"></script>
